name: Activity Generator CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'lambda/activity-generator/**'
      - '.github/workflows/activity-generator.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'lambda/activity-generator/**'

env:
  PYTHON_VERSION: '3.11'
  SERVICE_NAME: activity-generator
  AWS_REGION: us-east-1
  LAMBDA_FUNCTION_NAME: curriculum-activity-generator

permissions:
  id-token: write
  contents: read

jobs:
  # ==========================================================================
  # Quality & Testing
  # ==========================================================================
  quality-tests:
    name: Quality & Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          service-path: lambda/activity-generator

      - name: Lint and Security
        working-directory: lambda/activity-generator
        run: |
          pip install flake8 bandit safety
          
          # Lint
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          
          # Security
          bandit -r . -f txt || true
          safety check || true

      - name: Basic function test
        working-directory: lambda/activity-generator
        run: |
          python -c "
          import sys
          try:
              from lambda_function import lambda_handler
              print('✅ Activity generator handler imports successfully')
              
              # Basic test with mock event
              test_event = {
                  'body': '{\"topic\": \"Math\", \"grade_level\": \"3\", \"duration\": 10}'
              }
              
              class MockContext:
                  aws_request_id = 'test-123'
              
              # This would normally call OpenAI, so we just test the import
              print('✅ Function structure is valid')
              
          except ImportError as e:
              print(f'❌ Import error: {e}')
              sys.exit(1)
          except Exception as e:
              print(f'⚠️ Function test warning: {e}')
          "

  # ==========================================================================
  # Build & Deploy
  # ==========================================================================
  build-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: quality-tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          service-path: lambda/activity-generator

      - name: Build Lambda package
        uses: ./.github/actions/build-lambda
        with:
          service-name: ${{ env.SERVICE_NAME }}
          service-path: lambda/activity-generator
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123324351829:role/curriculum-designer-github-actions
          role-session-name: GitHubActions-ActivityGen-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          echo "🚀 Deploying activity-generator..."
          
          # Deploy to the shared function (no environment suffix)
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://lambda/activity-generator/${{ env.SERVICE_NAME }}-${{ github.sha }}.zip \
            --region ${{ env.AWS_REGION }}
          
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Test deployment
        run: |
          echo "🧪 Testing deployed activity generator..."
          
          TEST_PAYLOAD='{"body": "{\"topic\": \"CI/CD Test\", \"grade_level\": \"3\", \"duration\": 10}"}'
          
          aws lambda invoke \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --payload "$TEST_PAYLOAD" \
            --cli-binary-format raw-in-base64-out \
            test_response.json
          
          if [ -f test_response.json ]; then
            RESPONSE_CODE=$(cat test_response.json | jq -r '.statusCode // "unknown"')
            echo "📊 Response status: $RESPONSE_CODE"
            
            if [[ "$RESPONSE_CODE" == "200" ]]; then
              echo "✅ Activity generator test passed!"
            else
              echo "⚠️ Activity generator returned status: $RESPONSE_CODE"
              cat test_response.json
            fi
          fi