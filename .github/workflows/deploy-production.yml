name: Deploy Production Environment

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy all components'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: prod

permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      lambda_changed: ${{ steps.changes.outputs.lambda }}
      terraform_changed: ${{ steps.changes.outputs.terraform }}
      activity_generator_changed: ${{ steps.changes.outputs.activity_generator }}
      webhook_handler_changed: ${{ steps.changes.outputs.webhook_handler }}
      mcp_server_changed: ${{ steps.changes.outputs.mcp_server }}
      terraform_global_changed: ${{ steps.changes.outputs.terraform_global }}
      terraform_multi_env_changed: ${{ steps.changes.outputs.terraform_multi_env }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        run: |
          # Get list of changed files (or all files if force deploy)
          if [[ "${{ github.event.inputs.force_deploy }}" == "true" ]]; then
            echo "Force deploy enabled - marking all as changed"
            echo "lambda=true" >> $GITHUB_OUTPUT
            echo "terraform=true" >> $GITHUB_OUTPUT
            echo "activity_generator=true" >> $GITHUB_OUTPUT
            echo "webhook_handler=true" >> $GITHUB_OUTPUT
            echo "mcp_server=true" >> $GITHUB_OUTPUT
            echo "terraform_global=true" >> $GITHUB_OUTPUT
            echo "terraform_multi_env=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Check for Lambda changes
          if echo "$CHANGED_FILES" | grep -qE "^lambda/"; then
            echo "lambda=true" >> $GITHUB_OUTPUT
          else
            echo "lambda=false" >> $GITHUB_OUTPUT
          fi
          
          # Check for Terraform changes
          if echo "$CHANGED_FILES" | grep -qE "^terraform/.*\.tf$"; then
            echo "terraform=true" >> $GITHUB_OUTPUT
          else
            echo "terraform=false" >> $GITHUB_OUTPUT
          fi
          
          # Check specific Lambda functions
          if echo "$CHANGED_FILES" | grep -qE "^lambda/activity-generator/"; then
            echo "activity_generator=true" >> $GITHUB_OUTPUT
          else
            echo "activity_generator=false" >> $GITHUB_OUTPUT
          fi
          
          if echo "$CHANGED_FILES" | grep -qE "^lambda/webhook-handler/"; then
            echo "webhook_handler=true" >> $GITHUB_OUTPUT
          else
            echo "webhook_handler=false" >> $GITHUB_OUTPUT
          fi
          
          if echo "$CHANGED_FILES" | grep -qE "^lambda/mcp-server/"; then
            echo "mcp_server=true" >> $GITHUB_OUTPUT
          else
            echo "mcp_server=false" >> $GITHUB_OUTPUT
          fi
          
          # Check specific Terraform environments
          if echo "$CHANGED_FILES" | grep -qE "^terraform/environments/global/.*\.tf$"; then
            echo "terraform_global=true" >> $GITHUB_OUTPUT
          else
            echo "terraform_global=false" >> $GITHUB_OUTPUT
          fi
          
          if echo "$CHANGED_FILES" | grep -qE "^terraform/environments/multi-env/.*\.tf$"; then
            echo "terraform_multi_env=true" >> $GITHUB_OUTPUT
          else
            echo "terraform_multi_env=false" >> $GITHUB_OUTPUT
          fi

  build-lambdas:
    needs: detect-changes
    if: needs.detect-changes.outputs.lambda_changed == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Build changed Lambda functions
        run: |
          chmod +x lambda-deployments/build.sh
          
          if [[ "${{ needs.detect-changes.outputs.activity_generator_changed }}" == "true" ]]; then
            echo "Building activity-generator for production..."
            ./lambda-deployments/build.sh activity-generator
          fi
          
          if [[ "${{ needs.detect-changes.outputs.webhook_handler_changed }}" == "true" ]]; then
            echo "Building webhook-handler for production..."
            ./lambda-deployments/build.sh webhook-handler
          fi
          
          if [[ "${{ needs.detect-changes.outputs.mcp_server_changed }}" == "true" ]]; then
            echo "Building mcp-server for production..."
            ./lambda-deployments/build.sh mcp-server
          fi

      - name: Upload Lambda artifacts
        uses: actions/upload-artifact@v3
        with:
          name: lambda-deployments
          path: lambda-deployments/
          retention-days: 7

  deploy-infrastructure:
    needs: [detect-changes, build-lambdas]
    if: always() && (needs.detect-changes.outputs.terraform_changed == 'true' || needs.detect-changes.outputs.lambda_changed == 'true')
    runs-on: ubuntu-latest
    environment: production  # Requires manual approval
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123324351829:role/curriculum-designer-github-actions
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Download Lambda artifacts
        if: needs.detect-changes.outputs.lambda_changed == 'true'
        uses: actions/download-artifact@v3
        with:
          name: lambda-deployments
          path: lambda-deployments/

      - name: Deploy Production Infrastructure
        run: |
          echo "🚨 PRODUCTION DEPLOYMENT"
          echo "This deployment will affect the production environment."
          echo "Components to deploy:"
          echo "  - Lambda changed: ${{ needs.detect-changes.outputs.lambda_changed }}"
          echo "  - Terraform changed: ${{ needs.detect-changes.outputs.terraform_changed }}"
          
          # Deploy global resources if changed
          if [[ "${{ needs.detect-changes.outputs.terraform_global_changed }}" == "true" ]] || [[ "${{ needs.detect-changes.outputs.activity_generator_changed }}" == "true" ]]; then
            echo "Deploying global infrastructure..."
            cd terraform/environments/global
            terraform init
            
            if [[ "${{ needs.detect-changes.outputs.terraform_global_changed }}" == "true" ]]; then
              terraform apply -auto-approve
            elif [[ "${{ needs.detect-changes.outputs.activity_generator_changed }}" == "true" ]]; then
              terraform apply -target=aws_lambda_function.activity_generator -auto-approve
            fi
            cd ../../..
          fi
          
          # Deploy multi-env resources for production
          if [[ "${{ needs.detect-changes.outputs.terraform_multi_env_changed }}" == "true" ]] || [[ "${{ needs.detect-changes.outputs.webhook_handler_changed }}" == "true" ]] || [[ "${{ needs.detect-changes.outputs.mcp_server_changed }}" == "true" ]]; then
            echo "Deploying multi-environment infrastructure for production..."
            cd terraform/environments/multi-env
            terraform init
            terraform workspace select prod || terraform workspace new prod
            
            if [[ "${{ needs.detect-changes.outputs.terraform_multi_env_changed }}" == "true" ]]; then
              terraform apply -auto-approve
            else
              TARGETS=""
              if [[ "${{ needs.detect-changes.outputs.webhook_handler_changed }}" == "true" ]]; then
                TARGETS="$TARGETS -target=aws_lambda_function.webhook_handler_prod"
              fi
              if [[ "${{ needs.detect-changes.outputs.mcp_server_changed }}" == "true" ]]; then
                TARGETS="$TARGETS -target=aws_lambda_function.mcp_server_prod"
              fi
              if [[ -n "$TARGETS" ]]; then
                terraform apply $TARGETS -auto-approve
              fi
            fi
          fi

  test-production:
    needs: [detect-changes, deploy-infrastructure]
    if: always() && needs.deploy-infrastructure.result == 'success'
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123324351829:role/curriculum-designer-github-actions
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Smoke test production deployment
        run: |
          echo "🔍 Running production smoke tests..."
          
          # Test activity generator if deployed
          if [[ "${{ needs.detect-changes.outputs.activity_generator_changed }}" == "true" ]]; then
            echo "Testing activity generator..."
            aws lambda get-function --function-name curriculum-activity-generator > /dev/null
            echo "✅ Activity generator is accessible"
          fi
          
          # Test webhook handler if deployed  
          if [[ "${{ needs.detect-changes.outputs.webhook_handler_changed }}" == "true" ]]; then
            echo "Testing webhook handler..."
            # Assuming prod webhook handler has -prod suffix
            aws lambda get-function --function-name curriculum-designer-webhook-prod > /dev/null || true
            echo "✅ Webhook handler verification complete"
          fi

  notify-production:
    needs: [detect-changes, deploy-infrastructure, test-production]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Production Deployment Summary
        run: |
          echo "## 🚀 PRODUCTION Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**⚠️ This was a PRODUCTION deployment**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | Action |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.detect-changes.outputs.activity_generator_changed }}" == "true" ]]; then
            if [[ "${{ needs.deploy-infrastructure.result }}" == "success" ]]; then
              echo "| Activity Generator | ✅ | Deployed to PROD |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Activity Generator | ❌ | Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| Activity Generator | ⏭️ | Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.detect-changes.outputs.webhook_handler_changed }}" == "true" ]]; then
            if [[ "${{ needs.deploy-infrastructure.result }}" == "success" ]]; then
              echo "| Webhook Handler | ✅ | Deployed to PROD |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Webhook Handler | ❌ | Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| Webhook Handler | ⏭️ | Skipped |" >> $GITHUB_STEP_SUMMARY
          fi