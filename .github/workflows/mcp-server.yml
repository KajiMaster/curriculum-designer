name: MCP Server CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'lambda/mcp-server/**'
      - 'mcp-server/**'
      - '.github/workflows/mcp-server.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'lambda/mcp-server/**'
      - 'mcp-server/**'

env:
  PYTHON_VERSION: '3.11'
  SERVICE_NAME: mcp-server
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  # ==========================================================================
  # Quality & Testing
  # ==========================================================================
  quality-tests:
    name: Quality & Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Check both possible MCP locations
      - name: Determine MCP path
        id: path
        run: |
          if [ -d "lambda/mcp-server" ]; then
            echo "mcp-path=lambda/mcp-server" >> $GITHUB_OUTPUT
          elif [ -d "mcp-server" ]; then
            echo "mcp-path=mcp-server" >> $GITHUB_OUTPUT
          else
            echo "❌ MCP server path not found"
            exit 1
          fi

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          service-path: ${{ steps.path.outputs.mcp-path }}

      - name: Lint and Security
        working-directory: ${{ steps.path.outputs.mcp-path }}
        run: |
          pip install flake8 bandit safety
          
          # Lint
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=mcp-venv
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=mcp-venv
          
          # Security
          bandit -r . -f txt --exclude=mcp-venv || true
          safety check || true

      - name: Test MCP server functionality
        working-directory: ${{ steps.path.outputs.mcp-path }}
        run: |
          python -c "
          import sys
          try:
              # Test imports based on available files
              try:
                  from lambda_handler import lambda_handler
                  print('✅ MCP Lambda handler imports successfully')
              except ImportError:
                  try:
                      from server import main
                      print('✅ MCP server main function found')
                  except ImportError:
                      print('⚠️ No recognizable MCP handler found')
              
              print('✅ MCP server structure validated')
              
          except Exception as e:
              print(f'❌ MCP validation error: {e}')
              sys.exit(1)
          "

  # ==========================================================================
  # Build & Deploy
  # ==========================================================================
  build-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: quality-tests
    if: github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine MCP path
        id: path
        run: |
          if [ -d "lambda/mcp-server" ]; then
            echo "mcp-path=lambda/mcp-server" >> $GITHUB_OUTPUT
          elif [ -d "mcp-server" ]; then
            echo "mcp-path=mcp-server" >> $GITHUB_OUTPUT
          else
            echo "❌ MCP server path not found"
            exit 1
          fi

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          service-path: ${{ steps.path.outputs.mcp-path }}

      - name: Build Lambda package
        uses: ./.github/actions/build-lambda
        with:
          service-name: ${{ env.SERVICE_NAME }}
          service-path: ${{ steps.path.outputs.mcp-path }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123324351829:role/curriculum-designer-github-actions
          role-session-name: GitHubActions-MCP-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Development
        if: github.ref == 'refs/heads/develop'
        run: |
          echo "🚀 Deploying MCP server to development..."
          
          if aws lambda get-function --function-name curriculum-designer-mcp-dev 2>/dev/null; then
            aws lambda update-function-code \
              --function-name curriculum-designer-mcp-dev \
              --zip-file fileb://${{ steps.path.outputs.mcp-path }}/${{ env.SERVICE_NAME }}-${{ github.sha }}.zip \
              --region ${{ env.AWS_REGION }}
              
            aws lambda wait function-updated \
              --function-name curriculum-designer-mcp-dev \
              --region ${{ env.AWS_REGION }}
              
            echo "✅ MCP server dev updated successfully"
          else
            echo "ℹ️ MCP dev function does not exist, skipping deployment"
          fi

      # Production deployment removed - focusing on dev for now

      - name: Test deployment
        run: |
          echo "🧪 Testing MCP deployment..."
          
          FUNCTION_NAME="curriculum-designer-mcp-${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}"
          
          if aws lambda get-function --function-name $FUNCTION_NAME 2>/dev/null; then
            # Basic health check
            aws lambda invoke \
              --function-name $FUNCTION_NAME \
              --payload '{"httpMethod":"GET","path":"/health"}' \
              mcp_response.json \
              --region ${{ env.AWS_REGION }} || true
            
            if [ -f mcp_response.json ]; then
              echo "📊 MCP Response:"
              cat mcp_response.json
            fi
            
            echo "✅ MCP server deployment verified"
          fi