name: Deploy Lambda Function

on:
  push:
    branches: [develop]
    paths:
      - 'webhook-handler/**'
  pull_request:
    branches: [develop]
    paths:
      - 'webhook-handler/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  LAMBDA_FUNCTION_NAME_DEV: curriculum-designer-webhook-dev

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd webhook-handler
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint code
        run: |
          cd webhook-handler
          flake8 lambda_main.py --max-line-length=120 --ignore=E501,W503

      - name: Run tests
        run: |
          cd webhook-handler
          python -m pytest test_lambda.py -v

  deploy-dev:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: development
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123324351829:role/curriculum-designer-github-actions
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create deployment package (code only - dependencies in layer)
        run: |
          # Use universal build script
          chmod +x lambda-deployments/build.sh
          ./lambda-deployments/build.sh webhook-handler

      - name: Deploy to Lambda (Development)
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME_DEV }} \
            --zip-file fileb://lambda-deployments/webhook-handler/deployment.zip
            
      - name: Wait for function update to complete
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME_DEV }}

      - name: Update Lambda configuration (Development)
        run: |
          aws lambda update-function-configuration \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME_DEV }} \
            --runtime python3.11 \
            --handler lambda_function.handler \
            --timeout 30

      - name: Test deployment
        run: |
          # Wait for deployment to complete
          sleep 10
          
          # Simple function test without complex payload
          aws lambda invoke \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME_DEV }} \
            --log-type Tail \
            response.json \
            --query 'LogResult' \
            --output text | base64 -d
          
          echo "Function invoked successfully"