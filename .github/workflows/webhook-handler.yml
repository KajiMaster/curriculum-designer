name: Webhook Handler CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'webhook-handler/**'
      - '.github/workflows/webhook-handler.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'webhook-handler/**'

env:
  PYTHON_VERSION: '3.11'
  SERVICE_NAME: webhook-handler
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read
  pull-requests: write  # For coverage comments

jobs:
  # ==========================================================================
  # Quality & Testing Pipeline
  # ==========================================================================
  quality-tests:
    name: Quality & Tests
    runs-on: ubuntu-latest
    outputs:
      coverage-threshold-met: ${{ steps.coverage.outputs.threshold-met }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          service-path: webhook-handler

      - name: Install security tools
        run: |
          pip install bandit safety mypy
        working-directory: webhook-handler

      # Code Quality Checks
      - name: Lint with flake8
        working-directory: webhook-handler
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Security scan with Bandit
        working-directory: webhook-handler
        run: |
          bandit -r src/ -f json -o bandit-report.json -ll || true
          bandit -r src/ -ll

      - name: Dependency security check
        working-directory: webhook-handler
        run: |
          safety check --json --output safety-report.json || true
          safety check

      - name: Type checking with MyPy
        working-directory: webhook-handler
        continue-on-error: true
        run: mypy src/ --ignore-missing-imports

      # Unit Tests
      - name: Run unit tests
        id: coverage
        working-directory: webhook-handler
        env:
          TRELLO_API_KEY: test_key
          TRELLO_TOKEN: test_token
          OPENAI_API_KEY: test_openai_key
        run: |
          pytest tests/unit/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=70 \
            -v \
            --tb=short
          
          # Check if coverage threshold was met
          if [ $? -eq 0 ]; then
            echo "threshold-met=true" >> $GITHUB_OUTPUT
          else
            echo "threshold-met=false" >> $GITHUB_OUTPUT
          fi

      # Integration Tests with LocalStack
      - name: Start LocalStack
        run: |
          docker run -d \
            --name localstack \
            -p 4566:4566 \
            -e SERVICES=lambda,dynamodb,ssm,s3 \
            -e DEBUG=1 \
            localstack/localstack:latest
          
          # Wait for LocalStack to be ready
          timeout 60 bash -c 'until curl -s http://localhost:4566/health; do sleep 2; done'

      - name: Run integration tests
        working-directory: webhook-handler
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          LOCALSTACK_ENDPOINT: http://localhost:4566
        run: |
          pytest tests/integration/ -v --tb=short || true

      - name: Stop LocalStack
        if: always()
        run: docker stop localstack || true

      # Upload artifacts
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webhook-security-reports-${{ github.run_id }}
          path: |
            webhook-handler/bandit-report.json
            webhook-handler/safety-report.json

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: webhook-coverage-${{ github.run_id }}
          path: |
            webhook-handler/coverage.xml
            webhook-handler/htmlcov/

      - name: Coverage comment
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_PATH: webhook-handler/coverage.xml

  # ==========================================================================
  # Build Lambda Package
  # ==========================================================================  
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: quality-tests
    if: needs.quality-tests.outputs.coverage-threshold-met == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          service-path: webhook-handler

      - name: Build Lambda package
        uses: ./.github/actions/build-lambda
        with:
          service-name: ${{ env.SERVICE_NAME }}
          service-path: webhook-handler
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate Lambda package
        working-directory: webhook-handler
        run: |
          # Test import
          python -c "
          import sys, zipfile
          with zipfile.ZipFile('${{ env.SERVICE_NAME }}-${{ github.sha }}.zip', 'r') as z:
              z.extractall('test-import/')
          sys.path.insert(0, 'test-import/')
          
          try:
              from lambda_main import lambda_handler
              print('✅ Lambda handler imports successfully')
          except ImportError as e:
              print(f'❌ Import error: {e}')
              exit(1)
          "

      - name: Upload Lambda package
        uses: actions/upload-artifact@v4
        with:
          name: webhook-handler-package-${{ github.run_id }}
          path: webhook-handler/${{ env.SERVICE_NAME }}-${{ github.sha }}.zip
          retention-days: 7

  # ==========================================================================
  # Deploy to Development
  # ==========================================================================
  deploy-dev:
    name: Deploy Development
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: development
      url: ${{ steps.deploy.outputs.function-url }}
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123324351829:role/curriculum-designer-github-actions
          role-session-name: GitHubActions-WebhookDev-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Lambda package
        uses: actions/download-artifact@v4
        with:
          name: webhook-handler-package-${{ github.run_id }}

      - name: Deploy to Lambda
        id: deploy
        run: |
          echo "🚀 Deploying webhook-handler to development..."
          
          aws lambda update-function-code \
            --function-name curriculum-designer-webhook-dev \
            --zip-file fileb://${{ env.SERVICE_NAME }}-${{ github.sha }}.zip \
            --region ${{ env.AWS_REGION }}
          
          aws lambda wait function-updated \
            --function-name curriculum-designer-webhook-dev \
            --region ${{ env.AWS_REGION }}
          
          # Get function URL
          FUNCTION_URL=$(aws lambda get-function-url-config \
            --function-name curriculum-designer-webhook-dev \
            --region ${{ env.AWS_REGION }} \
            --query 'FunctionUrl' --output text 2>/dev/null || echo "No URL configured")
          
          echo "function-url=$FUNCTION_URL" >> $GITHUB_OUTPUT

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          sleep 10
          
          # Test health endpoint if URL is available
          FUNCTION_URL="${{ steps.deploy.outputs.function-url }}"
          if [ "$FUNCTION_URL" != "No URL configured" ]; then
            curl -f "$FUNCTION_URL/health" || echo "Health check failed"
          fi

  # ==========================================================================
  # Deploy to Production (Manual Approval)
  # ==========================================================================
  deploy-prod:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.function-url }}
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123324351829:role/curriculum-designer-github-actions
          role-session-name: GitHubActions-WebhookProd-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Lambda package
        uses: actions/download-artifact@v4
        with:
          name: webhook-handler-package-${{ github.run_id }}

      - name: Pre-deployment check
        run: |
          echo "🔍 Pre-deployment verification..."
          
          # Verify current function health
          aws lambda invoke \
            --function-name curriculum-designer-webhook-prod \
            --payload '{"httpMethod":"GET","path":"/health"}' \
            current_health.json \
            --region ${{ env.AWS_REGION }} || echo "Current function may be down"

      - name: Deploy to Production
        id: deploy
        run: |
          echo "🚨 PRODUCTION DEPLOYMENT - Webhook Handler"
          
          # Create backup alias
          CURRENT_VERSION=$(aws lambda get-function \
            --function-name curriculum-designer-webhook-prod \
            --region ${{ env.AWS_REGION }} \
            --query 'Configuration.Version' --output text)
          
          echo "📝 Current version: $CURRENT_VERSION"
          
          # Deploy new code
          NEW_VERSION=$(aws lambda update-function-code \
            --function-name curriculum-designer-webhook-prod \
            --zip-file fileb://${{ env.SERVICE_NAME }}-${{ github.sha }}.zip \
            --region ${{ env.AWS_REGION }} \
            --query 'Version' --output text)
          
          echo "📝 New version: $NEW_VERSION"
          
          aws lambda wait function-updated \
            --function-name curriculum-designer-webhook-prod \
            --region ${{ env.AWS_REGION }}
          
          # Publish version
          aws lambda publish-version \
            --function-name curriculum-designer-webhook-prod \
            --description "GitHub Actions Deploy - ${{ github.sha }}" \
            --region ${{ env.AWS_REGION }}
          
          # Update PROD alias
          aws lambda update-alias \
            --function-name curriculum-designer-webhook-prod \
            --name PROD \
            --function-version $NEW_VERSION \
            --region ${{ env.AWS_REGION }} || \
          aws lambda create-alias \
            --function-name curriculum-designer-webhook-prod \
            --name PROD \
            --function-version $NEW_VERSION \
            --region ${{ env.AWS_REGION }}
          
          echo "current-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Post-deployment verification
        run: |
          echo "🔍 Production verification..."
          sleep 15
          
          # Test Lambda invocation
          aws lambda invoke \
            --function-name curriculum-designer-webhook-prod:PROD \
            --payload '{"httpMethod":"GET","path":"/health"}' \
            prod_health.json \
            --region ${{ env.AWS_REGION }}
          
          if grep -q '"statusCode": 200' prod_health.json; then
            echo "✅ Production deployment verified"
          else
            echo "❌ Production verification failed"
            cat prod_health.json
            exit 1
          fi

      - name: Rollback on failure
        if: failure()
        run: |
          echo "🔄 Rolling back production deployment..."
          
          CURRENT_VERSION="${{ steps.deploy.outputs.current-version }}"
          
          if [ "$CURRENT_VERSION" != "" ]; then
            aws lambda update-alias \
              --function-name curriculum-designer-webhook-prod \
              --name PROD \
              --function-version $CURRENT_VERSION \
              --region ${{ env.AWS_REGION }}
            
            echo "✅ Rollback completed to version $CURRENT_VERSION"
          fi