name: Webhook Handler - Code Quality & Testing

on:
  push:
    branches: [main, develop]
    paths:
      - 'webhook-handler/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'webhook-handler/**'

env:
  PYTHON_VERSION: '3.11'  # Match your existing workflows

jobs:
  # ============================================================================
  # Code Quality & Security for Webhook Handler
  # ============================================================================
  quality-checks:
    name: 🔍 Code Quality & Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webhook-handler
        
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Cache Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('webhook-handler/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 🔧 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install bandit safety

      - name: 🎯 Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: 🛡️ Security Scan with Bandit
        run: |
          bandit -r src/ -f json -o bandit-report.json -ll || true
          bandit -r src/ -f txt -ll

      - name: 🔒 Dependency Security Check
        run: |
          safety check --json --output safety-report.json || true
          safety check

      - name: 📤 Upload Security Reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: webhook-security-reports-${{ github.sha }}
          path: |
            webhook-handler/bandit-report.json
            webhook-handler/safety-report.json

  # ============================================================================
  # Unit Tests for New Architecture
  # ============================================================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: quality-checks
    defaults:
      run:
        working-directory: webhook-handler
    
    strategy:
      matrix:
        python-version: ['3.11']  # Match your production version
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Cache Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.python-version }}-pip-${{ hashFiles('webhook-handler/requirements*.txt') }}

      - name: 🔧 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest-cov pytest-xdist

      - name: 🧪 Run Unit Tests
        env:
          # Test environment variables
          TRELLO_API_KEY: test_key
          TRELLO_TOKEN: test_token
          OPENAI_API_KEY: test_openai_key
          LOG_LEVEL: DEBUG
        run: |
          pytest tests/unit/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=70 \
            -v \
            --tb=short

      - name: 📊 Upload Coverage Reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: webhook-coverage-report-${{ github.sha }}
          path: |
            webhook-handler/coverage.xml
            webhook-handler/htmlcov/

      - name: 📈 Coverage Comment (PR only)
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_PATH: webhook-handler/coverage.xml

  # ============================================================================
  # Integration Tests
  # ============================================================================
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        working-directory: webhook-handler
        
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install moto[server]

      - name: 🔗 Run Integration Tests
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          TRELLO_API_KEY: test_key
          TRELLO_TOKEN: test_token
          OPENAI_API_KEY: test_openai_key
        run: |
          # Start moto server for AWS service mocking
          moto_server dynamodb -p 5000 &
          MOTO_PID=$!
          sleep 5
          
          # Run integration tests
          pytest tests/integration/ \
            -v \
            --tb=short || true
          
          # Cleanup
          kill $MOTO_PID || true

  # ============================================================================
  # Validate Lambda Package Structure
  # ============================================================================
  validate-package:
    name: 📦 Validate Lambda Package
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    defaults:
      run:
        working-directory: webhook-handler
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Test Package Creation (New Structure)
        run: |
          echo "🔧 Creating Lambda package with new optimized structure..."
          
          # Create deployment directory
          mkdir -p lambda-test-package
          
          # Copy optimized source code
          cp -r src/* lambda-test-package/
          cp lambda_main_optimized.py lambda-test-package/lambda_main.py
          
          # Install dependencies
          pip install -r requirements.txt -t lambda-test-package/
          
          # Remove unnecessary files
          find lambda-test-package/ -type d -name "__pycache__" -exec rm -rf {} + || true
          find lambda-test-package/ -type f -name "*.pyc" -delete || true
          find lambda-test-package/ -type d -name "*.dist-info" -exec rm -rf {} + || true
          find lambda-test-package/ -type d -name "tests" -exec rm -rf {} + || true
          
          # Test import
          python -c "
          import sys
          sys.path.insert(0, 'lambda-test-package/')
          try:
              from lambda_main import lambda_handler
              print('✅ Lambda handler imports successfully with new structure')
          except ImportError as e:
              print(f'❌ Import error: {e}')
              exit(1)
          "
          
          # Check package size
          du -h lambda-test-package/
          SIZE=$(du -s lambda-test-package/ | cut -f1)
          echo "Package size: ${SIZE}KB"

      - name: 🧪 Test Lambda Handler Execution
        run: |
          cd lambda-test-package
          python -c "
          import json
          import sys
          from lambda_main import lambda_handler
          
          # Test health check
          test_event = {
              'httpMethod': 'GET',
              'path': '/health',
              'headers': {}
          }
          
          class MockContext:
              aws_request_id = 'test-request-id'
              function_name = 'test-function'
          
          try:
              result = lambda_handler(test_event, MockContext())
              print('✅ Lambda handler executes successfully')
              print(f'Response: {json.dumps(result, indent=2)}')
              
              # Verify response structure
              assert 'statusCode' in result
              assert 'body' in result
              print('✅ Response structure is valid')
              
          except Exception as e:
              print(f'❌ Lambda execution error: {e}')
              import traceback
              traceback.print_exc()
              exit(1)
          "

  # ============================================================================
  # Summary
  # ============================================================================
  test-summary:
    name: 📋 Test Summary
    runs-on: ubuntu-latest
    needs: [quality-checks, unit-tests, integration-tests, validate-package]
    if: always()
    
    steps:
      - name: 📋 Generate Test Summary
        run: |
          echo "## 🧪 Webhook Handler Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.quality-checks.result }}" == "success" ]]; then
            echo "| Code Quality & Security | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Code Quality & Security | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.unit-tests.result }}" == "success" ]]; then
            echo "| Unit Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Unit Tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.integration-tests.result }}" == "success" ]]; then
            echo "| Integration Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Integration Tests | ⚠️ Issues |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.validate-package.result }}" == "success" ]]; then
            echo "| Lambda Package | ✅ Valid |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Lambda Package | ❌ Invalid |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Optimized Architecture**: Using new modular structure with `src/` directory" >> $GITHUB_STEP_SUMMARY
          echo "**Python Version**: ${{ env.PYTHON_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY