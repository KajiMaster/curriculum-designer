name: CI/CD Pipeline - Webhook Handler

on:
  push:
    branches: [main, develop]
    paths:
      - 'webhook-handler/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'webhook-handler/**'
      - '.github/workflows/ci-cd.yml'

env:
  PYTHON_VERSION: '3.11'
  AWS_REGION: us-east-1
  LAMBDA_FUNCTION_NAME: curriculum-webhook-handler

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # ============================================================================
  # Code Quality & Security Checks
  # ============================================================================
  quality-checks:
    name: 🔍 Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Cache Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('webhook-handler/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 🔧 Install Dependencies
        working-directory: webhook-handler
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install bandit safety

      - name: 🎯 Lint with flake8
        working-directory: webhook-handler
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: 🛡️ Security Scan with Bandit
        working-directory: webhook-handler
        run: |
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -f txt

      - name: 🔒 Dependency Security Check
        working-directory: webhook-handler
        run: |
          safety check --json --output safety-report.json || true
          safety check

      - name: 📋 Type Checking with MyPy (Optional)
        working-directory: webhook-handler
        continue-on-error: true
        run: |
          mypy src/ --ignore-missing-imports --no-strict-optional

      - name: 📤 Upload Security Reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports
          path: |
            webhook-handler/bandit-report.json
            webhook-handler/safety-report.json

  # ============================================================================
  # Unit Tests
  # ============================================================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: quality-checks
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Cache Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.python-version }}-pip-${{ hashFiles('webhook-handler/requirements*.txt') }}

      - name: 🔧 Install Dependencies
        working-directory: webhook-handler
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest-cov pytest-xdist

      - name: 🧪 Run Unit Tests
        working-directory: webhook-handler
        run: |
          pytest tests/unit/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=80 \
            -v \
            --tb=short \
            -x

      - name: 📊 Upload Coverage Reports
        uses: actions/upload-artifact@v3
        if: matrix.python-version == env.PYTHON_VERSION
        with:
          name: coverage-report
          path: |
            webhook-handler/coverage.xml
            webhook-handler/htmlcov/

      - name: 📈 Coverage Comment
        if: matrix.python-version == env.PYTHON_VERSION && github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_PATH: webhook-handler/coverage.xml

  # ============================================================================
  # Integration Tests
  # ============================================================================
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      # Mock external services for integration tests
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: lambda,dynamodb,ssm,s3
          DEBUG: 1
          LAMBDA_EXECUTOR: local
          
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Install Dependencies
        working-directory: webhook-handler
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install boto3 moto[server]

      - name: ⏳ Wait for LocalStack
        run: |
          timeout 60 bash -c 'until curl -s http://localhost:4566/health; do sleep 2; done'

      - name: 🔗 Run Integration Tests
        working-directory: webhook-handler
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          LOCALSTACK_ENDPOINT: http://localhost:4566
        run: |
          pytest tests/integration/ \
            -v \
            --tb=short \
            -x

  # ============================================================================
  # Build Lambda Package
  # ============================================================================
  build:
    name: 📦 Build Lambda Package
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Create Lambda Deployment Package
        working-directory: webhook-handler
        run: |
          # Create deployment directory
          mkdir -p lambda-deployment
          
          # Copy source code
          cp -r src/* lambda-deployment/
          cp lambda_main_optimized.py lambda-deployment/lambda_main.py
          
          # Install dependencies
          pip install -r requirements.txt -t lambda-deployment/
          
          # Remove unnecessary files to reduce package size
          find lambda-deployment/ -type d -name "__pycache__" -exec rm -rf {} + || true
          find lambda-deployment/ -type f -name "*.pyc" -delete || true
          find lambda-deployment/ -type d -name "*.dist-info" -exec rm -rf {} + || true
          find lambda-deployment/ -type d -name "tests" -exec rm -rf {} + || true
          
          # Create deployment zip
          cd lambda-deployment
          zip -r ../webhook-handler-${{ github.sha }}.zip .
          cd ..
          
          # Check package size (Lambda has 50MB limit for direct upload)
          SIZE=$(du -m webhook-handler-${{ github.sha }}.zip | cut -f1)
          echo "Package size: ${SIZE}MB"
          if [ $SIZE -gt 50 ]; then
            echo "Warning: Package size exceeds 50MB, consider using Lambda Layers"
          fi

      - name: 🔍 Validate Lambda Package
        working-directory: webhook-handler
        run: |
          # Test that the package can be imported
          python -c "
          import sys, zipfile
          with zipfile.ZipFile('webhook-handler-${{ github.sha }}.zip', 'r') as z:
              z.extractall('test-import/')
          sys.path.insert(0, 'test-import/')
          try:
              from lambda_main import lambda_handler
              print('✅ Lambda handler can be imported successfully')
          except ImportError as e:
              print(f'❌ Import error: {e}')
              exit(1)
          "

      - name: 📤 Upload Lambda Package
        uses: actions/upload-artifact@v3
        with:
          name: lambda-package-${{ github.sha }}
          path: webhook-handler/webhook-handler-${{ github.sha }}.zip
          retention-days: 30

  # ============================================================================
  # Deploy to Development
  # ============================================================================
  deploy-dev:
    name: 🚀 Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: 
      name: development
      url: ${{ steps.deploy.outputs.function-url }}
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Download Lambda Package
        uses: actions/download-artifact@v3
        with:
          name: lambda-package-${{ github.sha }}
          path: ./

      - name: ⚙️ Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123324351829:role/curriculum-designer-github-actions
          role-session-name: GitHubActions-Deploy-Dev
          aws-region: ${{ env.AWS_REGION }}

      - name: 🚀 Deploy to Lambda (Development)
        id: deploy
        run: |
          # Update function code
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }}-dev \
            --zip-file fileb://webhook-handler-${{ github.sha }}.zip \
            --region ${{ env.AWS_REGION }}
          
          # Wait for deployment to complete
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }}-dev \
            --region ${{ env.AWS_REGION }}
          
          # Update environment variables if needed
          aws lambda update-function-configuration \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }}-dev \
            --environment Variables="{ \
              LOG_LEVEL=DEBUG, \
              ENVIRONMENT=development \
            }" \
            --region ${{ env.AWS_REGION }} || true
          
          # Get function URL
          FUNCTION_URL=$(aws lambda get-function-url-config \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }}-dev \
            --region ${{ env.AWS_REGION } \
            --query 'FunctionUrl' --output text 2>/dev/null || echo "No URL configured")
          
          echo "function-url=$FUNCTION_URL" >> $GITHUB_OUTPUT

      - name: 🔍 Verify Deployment
        run: |
          sleep 10  # Wait for deployment to stabilize
          
          # Test health endpoint
          FUNCTION_URL="${{ steps.deploy.outputs.function-url }}"
          if [ "$FUNCTION_URL" != "No URL configured" ]; then
            curl -f "$FUNCTION_URL/health" || echo "Health check failed"
          fi

      - name: 💬 Deployment Notification
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
            const functionUrl = '${{ steps.deploy.outputs.function-url }}';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${status} **Development Deployment ${{ job.status }}**
              
              **Function:** ${{ env.LAMBDA_FUNCTION_NAME }}-dev
              **URL:** ${functionUrl}
              **Commit:** ${{ github.sha }}
              **Environment:** Development`
            });

  # ============================================================================
  # Deploy to Production
  # ============================================================================
  deploy-prod:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: 
      name: production
      url: ${{ steps.deploy.outputs.function-url }}
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Download Lambda Package
        uses: actions/download-artifact@v3
        with:
          name: lambda-package-${{ github.sha }}
          path: ./

      - name: ⚙️ Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123324351829:role/curriculum-designer-github-actions
          role-session-name: GitHubActions-Deploy-Prod
          aws-region: ${{ env.AWS_REGION }}

      - name: 📋 Pre-deployment Checks
        run: |
          # Verify current function is healthy before deployment
          echo "🔍 Verifying current production function..."
          
          aws lambda invoke \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --payload '{"httpMethod":"GET","path":"/health"}' \
            response.json \
            --region ${{ env.AWS_REGION }} || echo "Current function may be down"
          
          # Show current version
          aws lambda get-function \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Configuration.{Version:Version,LastModified:LastModified}' || true

      - name: 🚀 Deploy to Lambda (Production)
        id: deploy
        run: |
          # Create alias for rollback
          CURRENT_VERSION=$(aws lambda get-function \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Configuration.Version' --output text)
          
          echo "Current version: $CURRENT_VERSION"
          
          # Update function code
          NEW_VERSION=$(aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://webhook-handler-${{ github.sha }}.zip \
            --region ${{ env.AWS_REGION }} \
            --query 'Version' --output text)
          
          echo "New version: $NEW_VERSION"
          
          # Wait for deployment to complete
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }}
          
          # Publish new version
          aws lambda publish-version \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --description "Deployed from GitHub Actions - ${{ github.sha }}" \
            --region ${{ env.AWS_REGION }}
          
          # Update production alias
          aws lambda update-alias \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --name PROD \
            --function-version $NEW_VERSION \
            --region ${{ env.AWS_REGION }} || \
          aws lambda create-alias \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --name PROD \
            --function-version $NEW_VERSION \
            --region ${{ env.AWS_REGION }}
          
          # Get function URL
          FUNCTION_URL=$(aws lambda get-function-url-config \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'FunctionUrl' --output text 2>/dev/null || echo "No URL configured")
          
          echo "function-url=$FUNCTION_URL" >> $GITHUB_OUTPUT
          echo "current-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: 🔍 Post-deployment Verification
        id: verify
        run: |
          sleep 15  # Wait for deployment to stabilize
          
          echo "🔍 Verifying production deployment..."
          
          # Test health endpoint
          FUNCTION_URL="${{ steps.deploy.outputs.function-url }}"
          if [ "$FUNCTION_URL" != "No URL configured" ]; then
            if curl -f -s "$FUNCTION_URL/health" > health_response.json; then
              echo "✅ Health check passed"
              cat health_response.json
              echo "verification-status=success" >> $GITHUB_OUTPUT
            else
              echo "❌ Health check failed"
              echo "verification-status=failed" >> $GITHUB_OUTPUT
              exit 1
            fi
          else
            echo "⚠️ No function URL configured, skipping HTTP health check"
          fi
          
          # Test Lambda invocation directly
          aws lambda invoke \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }}:PROD \
            --payload '{"httpMethod":"GET","path":"/health"}' \
            invoke_response.json \
            --region ${{ env.AWS_REGION }}
          
          if grep -q '"statusCode": 200' invoke_response.json; then
            echo "✅ Lambda invocation test passed"
          else
            echo "❌ Lambda invocation test failed"
            cat invoke_response.json
            exit 1
          fi

      - name: 🔄 Rollback on Failure
        if: failure()
        run: |
          echo "🔄 Rolling back to previous version..."
          
          CURRENT_VERSION="${{ steps.deploy.outputs.current-version }}"
          
          if [ "$CURRENT_VERSION" != "" ] && [ "$CURRENT_VERSION" != "$LATEST" ]; then
            aws lambda update-alias \
              --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
              --name PROD \
              --function-version $CURRENT_VERSION \
              --region ${{ env.AWS_REGION }}
            
            echo "✅ Rollback completed to version $CURRENT_VERSION"
          else
            echo "⚠️ Cannot rollback - no previous version available"
          fi

      - name: 💬 Production Deployment Notification
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
            const functionUrl = '${{ steps.deploy.outputs.function-url }}';
            const newVersion = '${{ steps.deploy.outputs.new-version }}';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${status} **Production Deployment ${{ job.status }}**
              
              **Function:** ${{ env.LAMBDA_FUNCTION_NAME }}
              **Version:** ${newVersion}
              **URL:** ${functionUrl}
              **Commit:** ${{ github.sha }}
              **Environment:** Production
              
              ${status === '❌' ? '**Automatic rollback triggered**' : ''}`
            });

  # ============================================================================
  # Cleanup
  # ============================================================================
  cleanup:
    name: 🧹 Cleanup
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-prod]
    if: always()
    
    steps:
      - name: 🧹 Clean up old artifacts
        uses: actions/github-script@v6
        with:
          script: |
            // Keep only the last 5 artifacts for this workflow
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            
            const toDelete = artifacts.data.artifacts.slice(5);
            
            for (const artifact of toDelete) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }