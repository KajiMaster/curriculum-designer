name: Deploy Development Environment

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy all components'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev

permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      lambda_changed: ${{ steps.changes.outputs.lambda }}
      terraform_changed: ${{ steps.changes.outputs.terraform }}
      activity_generator_changed: ${{ steps.changes.outputs.activity_generator }}
      webhook_handler_changed: ${{ steps.changes.outputs.webhook_handler }}
      mcp_server_changed: ${{ steps.changes.outputs.mcp_server }}
      terraform_global_changed: ${{ steps.changes.outputs.terraform_global }}
      terraform_multi_env_changed: ${{ steps.changes.outputs.terraform_multi_env }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        run: |
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Check for Lambda changes
          if echo "$CHANGED_FILES" | grep -qE "^lambda/"; then
            echo "lambda=true" >> $GITHUB_OUTPUT
          else
            echo "lambda=false" >> $GITHUB_OUTPUT
          fi
          
          # Check for Terraform changes
          if echo "$CHANGED_FILES" | grep -qE "^terraform/.*\.tf$"; then
            echo "terraform=true" >> $GITHUB_OUTPUT
          else
            echo "terraform=false" >> $GITHUB_OUTPUT
          fi
          
          # Check specific Lambda functions
          if echo "$CHANGED_FILES" | grep -qE "^lambda/activity-generator/"; then
            echo "activity_generator=true" >> $GITHUB_OUTPUT
          else
            echo "activity_generator=false" >> $GITHUB_OUTPUT
          fi
          
          if echo "$CHANGED_FILES" | grep -qE "^lambda/webhook-handler/"; then
            echo "webhook_handler=true" >> $GITHUB_OUTPUT
          else
            echo "webhook_handler=false" >> $GITHUB_OUTPUT
          fi
          
          if echo "$CHANGED_FILES" | grep -qE "^lambda/mcp-server/"; then
            echo "mcp_server=true" >> $GITHUB_OUTPUT
          else
            echo "mcp_server=false" >> $GITHUB_OUTPUT
          fi
          
          # Check specific Terraform environments
          if echo "$CHANGED_FILES" | grep -qE "^terraform/environments/global/.*\.tf$"; then
            echo "terraform_global=true" >> $GITHUB_OUTPUT
          else
            echo "terraform_global=false" >> $GITHUB_OUTPUT
          fi
          
          if echo "$CHANGED_FILES" | grep -qE "^terraform/environments/multi-env/.*\.tf$"; then
            echo "terraform_multi_env=true" >> $GITHUB_OUTPUT
          else
            echo "terraform_multi_env=false" >> $GITHUB_OUTPUT
          fi
          
          # Force deploy override
          if [[ "${{ github.event.inputs.force_deploy }}" == "true" ]]; then
            echo "Force deploy enabled - marking all as changed"
            echo "lambda=true" >> $GITHUB_OUTPUT
            echo "terraform=true" >> $GITHUB_OUTPUT
            echo "activity_generator=true" >> $GITHUB_OUTPUT
            echo "webhook_handler=true" >> $GITHUB_OUTPUT
            echo "mcp_server=true" >> $GITHUB_OUTPUT
            echo "terraform_global=true" >> $GITHUB_OUTPUT
            echo "terraform_multi_env=true" >> $GITHUB_OUTPUT
          fi

  build-lambdas:
    needs: detect-changes
    if: needs.detect-changes.outputs.lambda_changed == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Build all Lambda functions
        run: |
          chmod +x lambda-deployments/build.sh
          
          # Build only changed functions or all if force
          if [[ "${{ needs.detect-changes.outputs.activity_generator_changed }}" == "true" ]]; then
            echo "Building activity-generator..."
            ./lambda-deployments/build.sh activity-generator
          fi
          
          if [[ "${{ needs.detect-changes.outputs.webhook_handler_changed }}" == "true" ]]; then
            echo "Building webhook-handler..."
            ./lambda-deployments/build.sh webhook-handler
          fi
          
          if [[ "${{ needs.detect-changes.outputs.mcp_server_changed }}" == "true" ]]; then
            echo "Building mcp-server..."
            ./lambda-deployments/build.sh mcp-server
          fi

      - name: Upload Lambda artifacts
        uses: actions/upload-artifact@v3
        with:
          name: lambda-deployments
          path: lambda-deployments/
          retention-days: 1

  deploy-infrastructure:
    needs: [detect-changes, build-lambdas]
    if: always() && (needs.detect-changes.outputs.terraform_changed == 'true' || needs.detect-changes.outputs.lambda_changed == 'true')
    runs-on: ubuntu-latest
    environment: development
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123324351829:role/curriculum-designer-github-actions
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Download Lambda artifacts
        if: needs.detect-changes.outputs.lambda_changed == 'true'
        uses: actions/download-artifact@v3
        with:
          name: lambda-deployments
          path: lambda-deployments/

      # Deploy Global Infrastructure (Activity Generator, Layers)
      - name: Deploy Global Infrastructure
        if: needs.detect-changes.outputs.terraform_global_changed == 'true' || needs.detect-changes.outputs.activity_generator_changed == 'true'
        run: |
          cd terraform/environments/global
          terraform init
          
          # Apply targeted resources based on what changed
          TERRAFORM_TARGETS=""
          
          if [[ "${{ needs.detect-changes.outputs.activity_generator_changed }}" == "true" ]]; then
            TERRAFORM_TARGETS="$TERRAFORM_TARGETS -target=aws_lambda_function.activity_generator"
          fi
          
          if [[ "${{ needs.detect-changes.outputs.terraform_global_changed }}" == "true" ]]; then
            # Apply all changes if terraform files changed
            terraform apply -auto-approve
          elif [[ -n "$TERRAFORM_TARGETS" ]]; then
            # Apply only targeted resources
            terraform apply $TERRAFORM_TARGETS -auto-approve
          fi

      # Deploy Multi-Environment Infrastructure (Webhook, MCP)
      - name: Deploy Multi-Environment Infrastructure  
        if: needs.detect-changes.outputs.terraform_multi_env_changed == 'true' || needs.detect-changes.outputs.webhook_handler_changed == 'true' || needs.detect-changes.outputs.mcp_server_changed == 'true'
        run: |
          cd terraform/environments/multi-env
          terraform init
          
          # Apply targeted resources based on what changed
          TERRAFORM_TARGETS=""
          
          if [[ "${{ needs.detect-changes.outputs.webhook_handler_changed }}" == "true" ]]; then
            TERRAFORM_TARGETS="$TERRAFORM_TARGETS -target=aws_lambda_function.webhook_handler_dev"
          fi
          
          if [[ "${{ needs.detect-changes.outputs.mcp_server_changed }}" == "true" ]]; then
            TERRAFORM_TARGETS="$TERRAFORM_TARGETS -target=aws_lambda_function.mcp_server_dev"
          fi
          
          if [[ "${{ needs.detect-changes.outputs.terraform_multi_env_changed }}" == "true" ]]; then
            # Apply all changes if terraform files changed
            terraform apply -auto-approve
          elif [[ -n "$TERRAFORM_TARGETS" ]]; then
            # Apply only targeted resources
            terraform apply $TERRAFORM_TARGETS -auto-approve
          fi

      # Legacy Lambda updates (for functions not yet managed by Terraform)
      - name: Update Webhook Handler (Legacy)
        if: needs.detect-changes.outputs.webhook_handler_changed == 'true'
        run: |
          # Update function code directly via AWS CLI if not managed by Terraform
          if aws lambda get-function --function-name curriculum-designer-webhook-dev 2>/dev/null; then
            aws lambda update-function-code \
              --function-name curriculum-designer-webhook-dev \
              --zip-file fileb://lambda-deployments/webhook-handler/deployment.zip
              
            aws lambda wait function-updated \
              --function-name curriculum-designer-webhook-dev
              
            aws lambda update-function-configuration \
              --function-name curriculum-designer-webhook-dev \
              --runtime python3.11 \
              --handler lambda_function.handler \
              --timeout 30
          fi

  test-deployment:
    needs: [detect-changes, deploy-infrastructure]
    if: always() && needs.deploy-infrastructure.result == 'success'
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123324351829:role/curriculum-designer-github-actions
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Test Activity Generator
        if: needs.detect-changes.outputs.activity_generator_changed == 'true'
        run: |
          TEST_PAYLOAD='{
            "body": "{\"topic\": \"CI/CD Test\", \"grade_level\": \"3\", \"duration\": 10}"
          }'
          
          aws lambda invoke \
            --function-name curriculum-activity-generator \
            --payload "$TEST_PAYLOAD" \
            --cli-binary-format raw-in-base64-out \
            test_response.json
          
          if [ -f test_response.json ]; then
            echo "Activity generator test successful"
            RESPONSE_CODE=$(cat test_response.json | jq -r '.statusCode // "unknown"')
            if [[ "$RESPONSE_CODE" == "200" ]]; then
              echo "✅ Activity generator test passed!"
            else
              echo "❌ Activity generator returned status: $RESPONSE_CODE"
              cat test_response.json
              exit 1
            fi
          else
            echo "❌ Activity generator test failed - no response"
            exit 1
          fi

      - name: Test Webhook Handler
        if: needs.detect-changes.outputs.webhook_handler_changed == 'true'
        run: |
          # Simple test to verify webhook handler is accessible
          aws lambda get-function --function-name curriculum-designer-webhook-dev > /dev/null
          echo "✅ Webhook handler deployment verified"

  notify-completion:
    needs: [detect-changes, deploy-infrastructure, test-deployment]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | Action |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.detect-changes.outputs.activity_generator_changed }}" == "true" ]]; then
            if [[ "${{ needs.deploy-infrastructure.result }}" == "success" ]]; then
              echo "| Activity Generator | ✅ | Deployed |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Activity Generator | ❌ | Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| Activity Generator | ⏭️ | Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.detect-changes.outputs.webhook_handler_changed }}" == "true" ]]; then
            if [[ "${{ needs.deploy-infrastructure.result }}" == "success" ]]; then
              echo "| Webhook Handler | ✅ | Deployed |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Webhook Handler | ❌ | Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| Webhook Handler | ⏭️ | Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.detect-changes.outputs.mcp_server_changed }}" == "true" ]]; then
            if [[ "${{ needs.deploy-infrastructure.result }}" == "success" ]]; then
              echo "| MCP Server | ✅ | Deployed |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| MCP Server | ❌ | Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| MCP Server | ⏭️ | Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.detect-changes.outputs.terraform_changed }}" == "true" ]]; then
            if [[ "${{ needs.deploy-infrastructure.result }}" == "success" ]]; then
              echo "| Terraform | ✅ | Applied |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Terraform | ❌ | Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| Terraform | ⏭️ | Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Development" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY