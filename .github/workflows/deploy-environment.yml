name: Deploy Environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: 'Environment to deploy to (dev/prod)'
      services:
        required: false
        type: string
        default: 'webhook-handler,mcp-server,activity-generator'
        description: 'Comma-separated list of services to deploy'
      terraform_apply:
        required: false
        type: boolean
        default: false
        description: 'Whether to apply Terraform changes'
    secrets:
      AWS_ROLE_TO_ASSUME:
        required: true

  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options:
          - dev
          - prod
        description: 'Environment to deploy to'
      services:
        required: false
        type: string
        default: 'webhook-handler,mcp-server,activity-generator'
        description: 'Comma-separated list of services to deploy'
      terraform_apply:
        required: false
        type: boolean
        default: false
        description: 'Apply Terraform infrastructure changes'

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.11'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || 'development' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions-EnvDeploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        if: inputs.terraform_apply
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Deploy Terraform infrastructure
        if: inputs.terraform_apply
        run: |
          echo "🏗️ Deploying infrastructure for ${{ inputs.environment }}..."
          
          # Deploy multi-env infrastructure
          if [ -d "terraform/environments/multi-env" ]; then
            cd terraform/environments/multi-env
            terraform init
            terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }}
            terraform apply -var-file=${{ inputs.environment }}.tfvars -auto-approve
            cd ../../..
          fi
          
          # Deploy global infrastructure for production
          if [ "${{ inputs.environment }}" = "prod" ] && [ -d "terraform/environments/global" ]; then
            cd terraform/environments/global
            terraform init
            terraform apply -auto-approve
            cd ../../..
          fi

      - name: Deploy Lambda functions
        run: |
          echo "🚀 Deploying Lambda functions to ${{ inputs.environment }}..."
          
          # Parse services list
          IFS=',' read -ra SERVICES <<< "${{ inputs.services }}"
          
          for service in "${SERVICES[@]}"; do
            service=$(echo "$service" | xargs) # trim whitespace
            
            case "$service" in
              "webhook-handler")
                FUNCTION_NAME="curriculum-designer-webhook-${{ inputs.environment == 'prod' && 'prod' || 'dev' }}"
                if aws lambda get-function --function-name $FUNCTION_NAME 2>/dev/null; then
                  echo "Updating $FUNCTION_NAME..."
                  # This would use pre-built artifacts in a real deployment
                  echo "✅ $service deployment placeholder"
                else
                  echo "⚠️ Function $FUNCTION_NAME not found"
                fi
                ;;
              "mcp-server")
                FUNCTION_NAME="curriculum-designer-mcp-${{ inputs.environment == 'prod' && 'prod' || 'dev' }}"
                if aws lambda get-function --function-name $FUNCTION_NAME 2>/dev/null; then
                  echo "Updating $FUNCTION_NAME..."
                  echo "✅ $service deployment placeholder"
                else
                  echo "⚠️ Function $FUNCTION_NAME not found"
                fi
                ;;
              "activity-generator")
                FUNCTION_NAME="curriculum-activity-generator"
                if aws lambda get-function --function-name $FUNCTION_NAME 2>/dev/null; then
                  echo "Updating $FUNCTION_NAME..."
                  echo "✅ $service deployment placeholder"
                else
                  echo "⚠️ Function $FUNCTION_NAME not found"
                fi
                ;;
              *)
                echo "❌ Unknown service: $service"
                ;;
            esac
          done

      - name: Run post-deployment tests
        run: |
          echo "🧪 Running post-deployment tests..."
          
          # Test each deployed service
          IFS=',' read -ra SERVICES <<< "${{ inputs.services }}"
          
          for service in "${SERVICES[@]}"; do
            service=$(echo "$service" | xargs)
            
            case "$service" in
              "webhook-handler")
                FUNCTION_NAME="curriculum-designer-webhook-${{ inputs.environment == 'prod' && 'prod' || 'dev' }}"
                if aws lambda get-function --function-name $FUNCTION_NAME 2>/dev/null; then
                  aws lambda invoke \
                    --function-name $FUNCTION_NAME \
                    --payload '{"httpMethod":"GET","path":"/health"}' \
                    webhook_test.json || true
                  echo "✅ Webhook handler test completed"
                fi
                ;;
              "activity-generator")
                FUNCTION_NAME="curriculum-activity-generator"
                if aws lambda get-function --function-name $FUNCTION_NAME 2>/dev/null; then
                  TEST_PAYLOAD='{"body": "{\"topic\": \"Test\", \"esl_level\": \"intermediate\", \"duration\": 10}"}'
                  aws lambda invoke \
                    --function-name $FUNCTION_NAME \
                    --payload "$TEST_PAYLOAD" \
                    --cli-binary-format raw-in-base64-out \
                    activity_test.json || true
                  echo "✅ Activity generator test completed"
                fi
                ;;
            esac
          done

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Summary - ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Services:** ${{ inputs.services }}" >> $GITHUB_STEP_SUMMARY
          echo "**Terraform Applied:** ${{ inputs.terraform_apply }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY